# Production stack for dfijdsif.website
# Deploy root on server: /var/www/dfijdsif
name: ssaudit

services:
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    volumes:
      - ssaudit_redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 12
    networks: [internal]

  api:
    image: ${SSAUDIT_API_IMAGE:-ghcr.io/edward-mccain/ssaudit-api:main}
    build:
      context: ..
      dockerfile: deploy/Dockerfile.api
    container_name: ssaudit-api
    restart: unless-stopped
    env_file:
      - /var/www/dfijdsif/.env
    environment:
      NODE_ENV: production
      API_HOST: 0.0.0.0
      API_PORT: "3712"
      DATABASE_URL: ${DATABASE_URL}
      REDIS_URL: redis://redis:6379
      WEB_PUBLIC_DIR: /data/web-public
      HOST_PROC_ROOT: /host/proc
      HOST_ROOT: /host/root
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      # Only mutable upload dirs — keep baked /uploads/casinos from the image
      - /var/www/dfijdsif/uploads/articles:/data/web-public/uploads/articles
      - /var/www/dfijdsif/uploads/banners:/data/web-public/uploads/banners
      - /var/www/dfijdsif/uploads/brand:/data/web-public/uploads/brand
      - /var/www/dfijdsif/uploads/content:/data/web-public/uploads/content
      - /proc:/host/proc:ro
      - /:/host/root:ro
    ports:
      - "127.0.0.1:3712:3712"
    depends_on:
      redis:
        condition: service_healthy
    networks:
      internal:
      edge:
        aliases: [ssaudit-api]

  web:
    image: ${SSAUDIT_WEB_IMAGE:-ghcr.io/edward-mccain/ssaudit-web:main}
    build:
      context: ..
      dockerfile: deploy/Dockerfile.web
      args:
        NUXT_PUBLIC_API_BASE: ${NUXT_PUBLIC_API_BASE:-https://dfijdsif.website}
        NUXT_PUBLIC_SITE_URL: ${NUXT_PUBLIC_SITE_URL:-https://dfijdsif.website}
        NUXT_PUBLIC_DASHBOARD_URL: ${NUXT_PUBLIC_DASHBOARD_URL:-https://dfijdsif.website}
        NUXT_PUBLIC_ALLOW_INDEXING: ${NUXT_PUBLIC_ALLOW_INDEXING:-false}
    container_name: ssaudit-web
    restart: unless-stopped
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: "3000"
      NITRO_HOST: 0.0.0.0
      NITRO_PORT: "3000"
      NUXT_PUBLIC_API_BASE: ${NUXT_PUBLIC_API_BASE:-https://dfijdsif.website}
      NUXT_PUBLIC_SITE_URL: ${NUXT_PUBLIC_SITE_URL:-https://dfijdsif.website}
      NUXT_PUBLIC_DASHBOARD_URL: ${NUXT_PUBLIC_DASHBOARD_URL:-https://dfijdsif.website}
      NUXT_PUBLIC_ALLOW_INDEXING: ${NUXT_PUBLIC_ALLOW_INDEXING:-false}
    volumes:
      # Do NOT mount whole /uploads — it hid image-baked /uploads/casinos (404s)
      - /var/www/dfijdsif/uploads/articles:/app/.output/public/uploads/articles
      - /var/www/dfijdsif/uploads/banners:/app/.output/public/uploads/banners
      - /var/www/dfijdsif/uploads/brand:/app/.output/public/uploads/brand
      - /var/www/dfijdsif/uploads/content:/app/.output/public/uploads/content
      # Server-owned staging robots (Disallow: /) — overrides image copy
      - /var/www/dfijdsif/robots.txt:/app/.output/public/robots.txt:ro
    ports:
      - "127.0.0.1:3710:3000"
    depends_on:
      - api
    networks:
      internal:
      edge:
        aliases: [ssaudit-web]

  dashboard:
    image: ${SSAUDIT_DASHBOARD_IMAGE:-ghcr.io/edward-mccain/ssaudit-dashboard:main}
    build:
      context: ..
      dockerfile: deploy/Dockerfile.dashboard
      args:
        NUXT_PUBLIC_API_BASE: ${NUXT_PUBLIC_API_BASE:-https://dfijdsif.website}
        NUXT_PUBLIC_SITE_URL: ${NUXT_PUBLIC_SITE_URL:-https://dfijdsif.website}
        NUXT_BUILD_ASSETS_DIR: /_nuxt_dash/
    container_name: ssaudit-dashboard
    restart: unless-stopped
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: "3000"
      NITRO_HOST: 0.0.0.0
      NITRO_PORT: "3000"
      NUXT_PUBLIC_API_BASE: ${NUXT_PUBLIC_API_BASE:-https://dfijdsif.website}
      NUXT_PUBLIC_SITE_URL: ${NUXT_PUBLIC_SITE_URL:-https://dfijdsif.website}
    ports:
      - "127.0.0.1:3711:3000"
    depends_on:
      - api
    networks:
      internal:
      edge:
        aliases: [ssaudit-dashboard]

networks:
  internal:
  edge:
    external: true
    name: casino-portal_default

volumes:
  ssaudit_redis:
